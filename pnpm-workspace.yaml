packages:
  - 'packages/*'
  - '!**/node_modules/**'
  - '!**/.worktrees/**'
  - '!**/.claude/worktrees/**'

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: false
  core-js-pure: false
  esbuild: true
  ffmpeg-ffprobe-static: true
  nx: true

catalog:
  '@preact/signals': ^1.3.4
  '@types/node': ^26.6.1
  clsx: ^2.1.1
  jsdom: ^29.1.1
  preact: ^10.29.8
  vite: ^8.3.0
  vitest: ^4.1.11

overrides:
  '@types/node': ^26.6.1
  cytoscape: 3.28.1
